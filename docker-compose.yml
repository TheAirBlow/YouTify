services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: youtify
      POSTGRES_PASSWORD: your_strong_password
      POSTGRES_DB: youtify
    volumes:
      - ./data:/var/lib/postgresql/data
  youtify:
    build: .
    container_name: youtify-bot
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql+psycopg://youtify:your_strong_password@db:5432/youtify"
      TZ: "UTC"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./credentials.json:/app/credentials.json:ro
      - ./logs:/app/logs